<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050C16">
<title>Ready to be curious this week? — Conditions for Curiosity</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="screen">
  <div class="eyebrow-row">
    <p class="eyebrow">Last thing</p>
    <button type="button" class="edit-link" onclick="location.href='details.html'">Edit your details</button>
  </div>

  <div class="center-stack">
    <h1 class="headline">Ready to be <em>curious</em> this week?</h1>
    <p class="body-copy">No streak, no score — just three chances this week to notice something together. You answer first, always.</p>
  </div>

  <div class="actions">
    <button type="button" class="btn-primary" id="commit-btn">I'm in</button>
  </div>
</main>

<script src="app.js"></script>
<script>
  const state = CFC.load();
  if (CFC.resumeUrl(state) !== "confirm.html") {
    location.replace(CFC.resumeUrl(state));
  } else {
    document.getElementById("commit-btn").addEventListener("click", () => {
      CFC.patch({ commitConfirmed: true, commitConfirmedAt: new Date().toISOString() });
      location.href = "complete.html";
    });
  }
</script>
</body>
</html>
