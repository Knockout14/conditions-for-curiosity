<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050C16">
<title>You're set — Conditions for Curiosity</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="screen" id="screen"></main>

<script src="app.js"></script>
<script>
  // This is the resting state — reachable only once episode5, details,
  // the check, a pick, and the commitment step are all done. Anything
  // short of that bounces to wherever's actually next.
  const state = CFC.load();
  if (CFC.resumeUrl(state) !== "complete.html") {
    location.replace(CFC.resumeUrl(state));
  } else {
    (async () => {
      const screen = document.getElementById("screen");
      const questions = await CFC.fetchQuestionsByIds(state.weeklyPick.questionIds);

      // Nothing writes to askedQuestionIds yet — that lands with the
      // nightly loop's circle-back step. Wired here now so a completed
      // question just starts showing grayed out the moment it does.
      const asked = new Set(state.askedQuestionIds || []);
      const items = questions
        .map((q, i) => {
          const done = asked.has(q.id);
          return `
        <div class="summary-item${done ? " done" : ""}">
          <span class="summary-rank">${i + 1}</span>
          <span>
            <div class="summary-text">${q.text}</div>
            <div class="summary-tag">${q.domain} · ${q.bigIdea || q.category}${done ? ' · <span class="summary-done-tag">done</span>' : ""}</div>
          </span>
        </div>`;
        })
        .join("");

      screen.innerHTML = `
        <p class="eyebrow">This week's three</p>
        <p class="lede">Ranked, in the order they'll come up. The nightly loop — actually running them — isn't built yet, so this is as far as v1 goes for now.</p>
        <div class="summary-list">${items}</div>
        <div class="spacer"></div>
        <div class="actions">
          <a class="link-secondary" id="reminder-link" href="#">Remind me tonight</a>
          <a class="link-secondary" href="pick.html">Change your picks</a>
          <a class="link-secondary" href="../index.html">Back to the podcast site</a>
        </div>`;

      wireReminderLink();
    })();
  }

  // A calendar reminder, not a push/email one — no service, no permission
  // prompt, works on any phone. One event, for the first night only (spec
  // asks for the "first nightly call back," not a running weekly series).
  function pad(n) {
    return String(n).padStart(2, "0");
  }
  function toICSDate(date) {
    return (
      date.getUTCFullYear() +
      pad(date.getUTCMonth() + 1) +
      pad(date.getUTCDate()) +
      "T" +
      pad(date.getUTCHours()) +
      pad(date.getUTCMinutes()) +
      pad(date.getUTCSeconds()) +
      "Z"
    );
  }
  function buildReminderICS(sessionId, url) {
    const now = new Date();
    const start = new Date(now);
    start.setHours(19, 0, 0, 0); // 7pm local — a default, editable in their own calendar app
    if (start <= now) start.setDate(start.getDate() + 1);
    const uid = `${sessionId || "cfc"}-first-reminder@conditionsforcuriosity.netlify.app`;
    return [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Conditions for Curiosity//App//EN",
      "BEGIN:VEVENT",
      `UID:${uid}`,
      `DTSTAMP:${toICSDate(now)}`,
      `DTSTART:${toICSDate(start)}`,
      "DURATION:PT15M",
      "SUMMARY:Tonight's question — Conditions for Curiosity",
      `DESCRIPTION:Time for your first question this week. Open: ${url}`,
      `URL:${url}`,
      "BEGIN:VALARM",
      "ACTION:DISPLAY",
      "DESCRIPTION:Reminder",
      "TRIGGER:-PT0M",
      "END:VALARM",
      "END:VEVENT",
      "END:VCALENDAR",
    ].join("\r\n");
  }
  function wireReminderLink() {
    document.getElementById("reminder-link").addEventListener("click", (e) => {
      e.preventDefault();
      const url = location.origin + "/app/complete.html";
      const ics = buildReminderICS(state.sessionId, url);
      const blob = new Blob([ics], { type: "text/calendar" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "conditions-for-curiosity-reminder.ics";
      link.click();
      URL.revokeObjectURL(link.href);
    });
  }
</script>
</body>
</html>
