<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050C16">
<title>You're set — Conditions for Curiosity</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="screen" id="screen"></main>

<script src="app.js"></script>
<script>
  // This is the resting state — reachable only once episode5, details,
  // the check, a pick, and the commitment step are all done. Anything
  // short of that bounces to wherever's actually next.
  const state = CFC.load();
  if (CFC.resumeUrl(state) !== "complete.html") {
    location.replace(CFC.resumeUrl(state));
  } else if (new URLSearchParams(location.search).has("next")) {
    // A calendar reminder link lands here with ?next=<id> — that id is
    // just a hint (nextQuestion() recomputes the real answer from state
    // regardless), so this hop straight into the loop rather than
    // stopping at the summary.
    location.replace("open.html");
  } else {
    (async () => {
      const screen = document.getElementById("screen");
      const questions = await CFC.fetchQuestionsByIds(state.weeklyPick.questionIds);
      const asked = new Set(state.askedQuestionIds || []);

      // Answered ones sink to the bottom rather than just graying out in
      // place — original rank preserved as a stable sort key within each
      // group, so ties don't reshuffle on every reload.
      const ordered = questions
        .map((q, i) => ({ q, rank: i + 1, done: asked.has(q.id) }))
        .sort((a, b) => a.done - b.done || a.rank - b.rank);

      const items = ordered
        .map(
          ({ q, rank, done }, i) => `
        <div class="summary-item${done ? " done" : ""}">
          <span class="summary-rank">${i + 1}</span>
          <span>
            <div class="summary-text">${q.text}</div>
            <div class="summary-tag">${q.domain} · ${q.bigIdea || q.category}${done ? ' · <span class="summary-done-tag">done</span>' : ""}</div>
          </span>
        </div>`
        )
        .join("");

      // Checked against this week's specific three, not asked.size —
      // askedQuestionIds only ever grows, across every week ever, so a
      // size check alone would misfire "done" from week 2 onward before
      // any of that week's three were actually asked.
      const allDone = questions.every((q) => asked.has(q.id));
      if (allDone) CFC.maybeSubmitWeekSummary(state, questions);

      screen.innerHTML = `
        <p class="eyebrow">This week's three</p>
        <p class="lede">${allDone ? "All three asked. Nice." : "Ranked, in the order they'll come up."}</p>
        <div class="summary-list">${items}</div>
        <div class="spacer"></div>
        ${
          allDone
            ? ""
            : `<div class="actions" style="margin-bottom:20px">
                 <button type="button" class="btn-primary" id="begin-btn">Begin tonight's question</button>
               </div>`
        }
        <p class="calendar-label">Add a reminder for your next question:</p>
        <div class="calendar-row">
          <a class="btn-outline" id="gcal-link" target="_blank" rel="noopener">Google Calendar</a>
          <button type="button" class="btn-outline" id="ical-link">Apple Calendar</button>
        </div>
        <div class="actions" style="margin-top:20px">
          <a class="link-secondary" href="pick.html">Change your picks</a>
          <a class="link-secondary" href="../index.html">Back to the podcast site</a>
        </div>`;

      const beginBtn = document.getElementById("begin-btn");
      if (beginBtn) beginBtn.addEventListener("click", () => (location.href = "open.html"));

      wireReminderButtons(questions, asked);
    })();
  }

  // Points at whichever question is actually next (CFC.nextQuestion),
  // and at complete.html?next=<id> — which, as of the nightly loop
  // existing, now redirects straight into the loop instead of just
  // landing on this summary.
  const ORDINALS = ["first", "second", "third"];

  function wireReminderButtons(questions, asked) {
    const next = CFC.nextQuestion(state, questions);
    if (!next) return; // all three done — nothing left to remind about
    const q = next.question;
    const url = `${location.origin}/app/complete.html?next=${q.id}`;

    CFC.wireCalendarButtons(document.getElementById("gcal-link"), document.getElementById("ical-link"), {
      title: `Tonight's question: ${q.text}`,
      description: `Your ${ORDINALS[next.index] || "next"} pick this week. Open: ${url}`,
      url,
      start: CFC.nextEventStart(),
      uid: `${state.sessionId || "cfc"}-q${q.id}@conditionsforcuriosity.netlify.app`,
    });
  }
</script>
</body>
</html>
