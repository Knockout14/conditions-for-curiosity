<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050C16">
<title>One more thing — Conditions for Curiosity</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="screen">
  <h1 class="eyebrow tight">One more thing</h1>

  <form id="details-form" novalidate>
    <div class="field">
      <label class="field-label" for="name">Your first name</label>
      <input class="field-input" type="text" id="name" name="name" placeholder="Priya" autocomplete="given-name" required>
      <p class="field-hint">So we don't mix you up with another family.</p>
    </div>

    <div class="field">
      <div class="field-label-row">
        <label class="field-label" for="email">Email</label>
        <span class="field-optional">Optional</span>
      </div>
      <input class="field-input optional" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
      <p class="field-hint">So we can follow up if something in your feedback is worth asking about.</p>
    </div>

    <div class="field" role="radiogroup" aria-label="Your kid's age">
      <span class="field-label">Your kid's age</span>
      <div class="age-row">
        <input class="age-radio visually-hidden" type="radio" id="age-3-4" name="ageBand" value="3-4" required>
        <label class="age-pill" for="age-3-4">3–4</label>
        <input class="age-radio visually-hidden" type="radio" id="age-5-6" name="ageBand" value="5-6" required>
        <label class="age-pill" for="age-5-6">5–6</label>
        <input class="age-radio visually-hidden" type="radio" id="age-7-8" name="ageBand" value="7-8" required>
        <label class="age-pill" for="age-7-8">7–8+</label>
      </div>
      <p class="field-hint">Just a range — this only shapes which questions we offer.</p>
    </div>

    <div class="spacer"></div>

    <button type="submit" class="btn-primary" id="continue-btn">Continue</button>
    <p class="helper-note"><a href="../privacy.html" target="_blank" rel="noopener">What I do with this info</a></p>
  </form>
</main>

<script src="app.js"></script>
<script>
  CFC.requireStep((s) => s.episode5, "index.html");

  const form = document.getElementById("details-form");
  const nameInput = document.getElementById("name");
  const emailInput = document.getElementById("email");

  // Restore anything already saved (e.g. returning to edit from a later screen).
  const existing = CFC.load();
  if (existing.name) nameInput.value = existing.name;
  if (existing.email) emailInput.value = existing.email;
  if (existing.ageBand) {
    const radio = form.querySelector(`input[name="ageBand"][value="${existing.ageBand}"]`);
    if (radio) radio.checked = true;
  }

  // Native constraint validation (required name, required-as-a-group age
  // radios, type=email format) does the checking — reportValidity() shows
  // the browser's own inline message pointing at whichever field is
  // actually incomplete, instead of a silently-disabled button.
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    const ageBand = form.querySelector('input[name="ageBand"]:checked').value;
    const newState = CFC.patch({
      name: nameInput.value.trim(),
      email: emailInput.value.trim(),
      ageBand,
    });
    location.href = CFC.resumeUrl(newState);
  });
</script>
</body>
</html>
